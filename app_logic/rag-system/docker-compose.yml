version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  fastapi-app:
    build: ./fastapi-app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant

  ingestion-worker:
    build: ./ingestion-worker
    depends_on:
      - postgres
      - qdrant
    environment:
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
